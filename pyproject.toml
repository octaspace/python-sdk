[build-system]
requires = ["hatchling>=1.33"]
build-backend = "hatchling.build"

[project]
name = "octaspace"
dynamic = ["version"]
description = "Official Python SDK for the OctaSpace API."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
  { name = "OctaSpace" },
]
keywords = ["octaspace", "sdk", "api", "gpu", "cloud", "compute"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1.0",
]

[project.urls]
Homepage = "https://octa.space"
Documentation = "https://github.com/octaspace/python-sdk#readme"
Repository = "https://github.com/octaspace/python-sdk"
Issues = "https://github.com/octaspace/python-sdk/issues"
Changelog = "https://github.com/octaspace/python-sdk/blob/main/CHANGELOG.md"

[dependency-groups]
test = [
  "pytest>=9.2",
  "pytest-cov>=7.1",
  "respx>=0.23",
]
lint = [
  "ruff>=0.17",
]
typecheck = [
  "mypy>=2.4",
]
dev = [
  { include-group = "test" },
  { include-group = "lint" },
  { include-group = "typecheck" },
]

[tool.hatch.version]
path = "src/octaspace/__about__.py"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE",
  "/pyproject.toml",
]
core-metadata-version = "2.4"

[tool.hatch.build.targets.wheel]
packages = ["src/octaspace"]
core-metadata-version = "2.4"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --cov=octaspace --cov-report=term-missing"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["octaspace"]
